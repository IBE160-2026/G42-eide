[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162,<0.163",
    "pydantic>=2.14,<2.15",
    "pydantic-settings>=2.16,<2.17",
    "pypdf>=6.21,<6.22",
    "python-multipart==0.0.32",
    "uvicorn>=0.54,<0.55",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pytest>=9.1,<9.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
